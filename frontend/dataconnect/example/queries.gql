mutation CreateUser($fullName: String!, $email: String!, $role: String!) @auth(level: USER) {
  user_insert(data: { id_expr: "auth.uid", fullName: $fullName, email: $email, role: $role })
}

mutation UpdateUser($fullName: String) @auth(level: USER) {
  user_update(key: { id_expr: "auth.uid" }, data: { fullName: $fullName })
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: { id_expr: "auth.uid" })
}

query GetUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    fullName
    email
  }
}

query ListUsers @auth(level: PUBLIC, insecureReason: "Publicly list medical professionals") {
  users {
    id
    fullName
    role
  }
}

mutation CreatePatientProfile($dateOfBirth: Date!) @auth(level: USER) {
  patientProfile_insert(data: { userId_expr: "auth.uid", dateOfBirth: $dateOfBirth })
}

mutation UpdatePatientProfile($dateOfBirth: Date) @auth(level: USER) {
  patientProfile_update(key: { id_expr: "auth.uid" }, data: { dateOfBirth: $dateOfBirth })
}

mutation DeletePatientProfile @auth(level: USER) {
  patientProfile_delete(key: { id_expr: "auth.uid" })
}

query GetMyPatientProfile @auth(level: USER) {
  patientProfile(key: { id_expr: "auth.uid" }) {
    dateOfBirth
    currentMedications
  }
}

query ListPatientProfiles @auth(level: USER) {
  patientProfiles {
    id
    user { fullName }
  }
}

mutation CreateVitalReading($heartRate: Int!, $systolicBP: Int!, $diastolicBP: Int!, $timestamp: Timestamp!) @auth(level: USER) {
  vitalReading_insert(data: { patientId_expr: "auth.uid", heartRate: $heartRate, systolicBP: $systolicBP, diastolicBP: $diastolicBP, timestamp: $timestamp })
}

mutation UpdateVitalReading($id: UUID!, $notes: String) @auth(level: USER) {
  vitalReading_update(id: $id, data: { notes: $notes })
}

mutation DeleteVitalReading($id: UUID!) @auth(level: USER) {
  vitalReading_delete(id: $id)
}

query GetVitalReading($id: UUID!) @auth(level: USER) {
  vitalReading(id: $id) {
    heartRate
    systolicBP
  }
}

query ListMyVitalReadings @auth(level: USER) {
  vitalReadings(where: { patientId: { eq_expr: "auth.uid" } }) {
    timestamp
    heartRate
  }
}

mutation CreateAssignment($patientId: UUID!) @auth(level: USER) {
  doctorPatientAssignment_insert(data: { doctorId_expr: "auth.uid", patientId: $patientId })
}

mutation UpdateAssignment($id: UUID!, $customThresholds: String) @auth(level: USER) {
  doctorPatientAssignment_update(id: $id, data: { customThresholds: $customThresholds })
}

mutation DeleteAssignment($id: UUID!) @auth(level: USER) {
  doctorPatientAssignment_delete(id: $id)
}

query GetAssignment($id: UUID!) @auth(level: USER) {
  doctorPatientAssignment(id: $id) {
    patient { fullName }
  }
}

query ListMyAssignments @auth(level: USER) {
  doctorPatientAssignments(where: { doctorId: { eq_expr: "auth.uid" } }) {
    patient { fullName }
  }
}

mutation CreateAlert($patientId: UUID!, $triggerReason: String!, $severity: String!) @auth(level: USER) {
  alert_insert(data: { patientId: $patientId, triggerReason: $triggerReason, severity: $severity, status: "OPEN" })
}

mutation UpdateAlert($id: UUID!, $status: String!) @auth(level: USER) {
  alert_update(id: $id, data: { status: $status })
}

mutation DeleteAlert($id: UUID!) @auth(level: USER) {
  alert_delete(id: $id)
}

query GetAlert($id: UUID!) @auth(level: USER) {
  alert(id: $id) {
    triggerReason
    severity
  }
}

query ListAlerts @auth(level: USER) {
  alerts {
    triggerReason
    status
  }
}