server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cấu hình để hỗ trợ Client-side routing của React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bỏ qua log cho các file tĩnh để tăng hiệu suất
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
    }
}
